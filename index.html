<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VORQEN - International Sports Gear & Manufacturing</title>
    <meta name="description" content="VORQEN sports gear, protective gloves, leather goods, and custom apparel supported by FLAKES IMPEX (Sialkot, Pakistan). International B2B quotations, workshop craftsmanship, and custom private-label manufacturing." />
    
    <!-- OpenGraph & Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VORQEN - International Sports Gear & Manufacturing" />
    <meta property="og:description" content="VORQEN sports gear, protective gloves, leather goods, and custom apparel supported by FLAKES IMPEX (Sialkot, Pakistan)." />
    <meta property="og:site_name" content="VORQEN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VORQEN - International Sports Gear & Manufacturing" />
    <meta name="twitter:description" content="VORQEN sports gear, protective gloves, leather goods, and custom apparel supported by FLAKES IMPEX (Sialkot, Pakistan)." />
    
    <!-- Google Fonts for Athletic/Luxury Industrial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Structured Data JSON-LD for International Brand & Manufacturing -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Brand",
      "name": "VORQEN",
      "slogan": "BUILT FOR PERFORMANCE. MADE FOR THE WORLD.",
      "description": "Premium sports gear, work and safety gloves, tactical gloves, motorcycle gloves, leather products, and sportswear supported by FLAKES IMPEX in Sialkot, Pakistan.",
      "manufacturer": {
        "@type": "Organization",
        "name": "FLAKES IMPEX",
        "foundingDate": "2001",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sialkot",
          "addressCountry": "PK"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+923224853236",
          "contactType": "sales",
          "email": "vorqenimpex@gmail.com",
          "availableLanguage": ["en"]
        },
        "url": "https://www.flakesimpex.com/"
      }
    }
    </script>
  </head>
  <body class="bg-[#111111] text-[#F3F5F4] antialiased selection:bg-[#123D2A] selection:text-white min-h-screen">
    <!-- Netlify Forms detection form (hidden, automatically captured by Netlify build crawler) -->
    <form name="vorqen-inquiries" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="vorqen-inquiries" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="text" name="companyName" />
      <input type="email" name="email" />
      <input type="text" name="country" />
      <input type="text" name="phoneOrWhatsApp" />
      <input type="text" name="subject" />
      <input type="text" name="productCategory" />
      <input type="text" name="productName" />
      <input type="text" name="estimatedQuantity" />
      <textarea name="message"></textarea>
      <textarea name="additionalNotes"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
