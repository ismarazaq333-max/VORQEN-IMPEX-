# Netlify Configuration for VORQEN International
# Supports React Vite SPA routing, Serverless Email Functions, and Netlify Forms

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route API calls to Netlify serverless functions
[[redirects]]
  from = "/api/inquiries"
  to = "/.netlify/functions/inquiries"
  status = 200

[[redirects]]
  from = "/api/email/status"
  to = "/.netlify/functions/email-status"
  status = 200

[[redirects]]
  from = "/api/email/test"
  to = "/.netlify/functions/email-test"
  status = 200

[[redirects]]
  from = "/api/email/logs"
  to = "/.netlify/functions/email-status"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Client-side routing for Single Page Application (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
